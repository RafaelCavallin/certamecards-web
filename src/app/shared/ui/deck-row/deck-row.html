<div class="flex flex-wrap items-center gap-4 rounded-md bg-surface px-4 py-3">
  <div class="min-w-0 flex-1">
    <p class="text-xs font-semibold tracking-wide text-ink-muted uppercase">{{ subject() }}</p>
    <button
      type="button"
      class="truncate text-left text-base font-semibold text-ink underline-offset-2 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
      (click)="onOpen()"
    >
      {{ title() }}
    </button>
  </div>
  <div class="flex gap-4 text-sm text-ink-muted">
    <span [class.text-amber]="due() > 0">
      <strong class="font-mono font-medium" [class.text-amber]="due() > 0">{{ due() }}</strong>
      para revisar
    </span>
    <span><strong class="font-mono font-medium text-ink">{{ fresh() }}</strong> novos</span>
  </div>
  @if (due() > 0 || fresh() > 0) {
    <button appButton type="button" (click)="onStudy()">Estudar</button>
  } @else {
    <button appButton type="button" disabled>Em dia</button>
  }
</div>
