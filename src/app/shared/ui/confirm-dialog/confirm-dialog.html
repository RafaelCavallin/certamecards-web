<dialog
  #dialog
  class="w-full max-w-[420px] rounded-lg border-0 bg-surface-raised p-6 text-ink backdrop:bg-black/50"
  (cancel)="onCancel()"
>
  <h2 class="font-sans text-lg font-semibold text-ink">{{ title() }}</h2>
  <p class="mt-2 text-sm text-ink-muted">{{ message() }}</p>
  <div class="mt-6 flex justify-end gap-2">
    <button appButton variant="ghost" type="button" (click)="onCancel()">{{ cancelLabel() }}</button>
    <button appButton type="button" (click)="onConfirm()">{{ confirmLabel() }}</button>
  </div>
</dialog>
