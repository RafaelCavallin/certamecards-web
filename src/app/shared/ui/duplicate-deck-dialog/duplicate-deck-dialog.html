<app-sheet [open]="open()" title="Duplicar como deck próprio" (closed)="canceled.emit()">
  <div class="space-y-5">
    <fieldset class="space-y-2">
      <legend class="text-sm font-semibold text-ink">Progresso</legend>
      @for (option of progressOptions(); track option.label) {
        <label class="block space-y-0.5">
          <input type="radio" name="carry-progress" [checked]="choice().carryProgress === option.value" (change)="onProgress(option.value)" />
          <span class="ml-2 text-ink">{{ option.label }}</span>
          <span class="block pl-6 text-sm text-ink-muted">{{ option.effect }}</span>
        </label>
      }
    </fieldset>
    @if (subscribed()) {
      <fieldset class="space-y-2">
        <legend class="text-sm font-semibold text-ink">Sua inscrição no deck oficial</legend>
        @for (option of subscriptionOptions(); track option.label) {
          <label class="block space-y-0.5">
            <input type="radio" name="cancel-subscription" [checked]="choice().cancelSubscription === option.value" (change)="onSubscription(option.value)" />
            <span class="ml-2 text-ink">{{ option.label }}</span>
            <span class="block pl-6 text-sm text-ink-muted">{{ option.effect }}</span>
          </label>
        }
      </fieldset>
    }
    <p class="text-sm text-ink">{{ notice() }}</p>
    @if (errorMessage()) {
      <p class="text-sm text-rate-again" role="alert">{{ errorMessage() }}</p>
    }
    <div class="flex justify-end gap-2">
      <button appButton variant="ghost" type="button" [disabled]="busy()" (click)="canceled.emit()">Cancelar</button>
      <button appButton variant="primary" type="button" [disabled]="busy()" (click)="onConfirm()">Duplicar</button>
    </div>
  </div>
</app-sheet>
