<main class="mx-auto flex min-h-dvh max-w-[720px] flex-col justify-center gap-6 px-4 py-12 text-center">
  <h1 class="font-serif text-2xl text-ink">Aceite os termos para continuar</h1>
  <p class="text-ink-muted">
    Para usar o CertameCards com sua conta Google, você precisa aceitar os termos de uso e a política de
    privacidade.
  </p>
  @if (errorMessage(); as message) {
    <p class="text-sm text-rate-again" role="alert" aria-live="assertive">{{ message }}</p>
  }
  <button
    type="button"
    (click)="onAccept()"
    [disabled]="submitting()"
    class="mx-auto h-[var(--control-height)] rounded-md bg-amber px-6 text-on-amber disabled:opacity-55"
  >
    Aceitar termos e continuar
  </button>
</main>
