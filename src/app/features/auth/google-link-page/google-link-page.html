<main class="mx-auto flex min-h-dvh max-w-[720px] flex-col justify-center gap-6 px-4 py-12">
  <div class="space-y-2 text-center">
    <h1 class="font-serif text-2xl text-ink">Vincular sua conta Google</h1>
    <p class="text-ink-muted">Já existe uma conta com esse e-mail. Confirme sua senha para juntar os dois acessos.</p>
  </div>
  <form class="space-y-4" (submit)="onSubmit(); $event.preventDefault()">
    <div class="space-y-1">
      <label class="block text-sm text-ink-muted" for="link-password">Senha atual</label>
      <input
        id="link-password"
        type="password"
        autocomplete="current-password"
        [formField]="linkForm.password"
        class="h-[var(--control-height)] w-full rounded-md border border-line-strong bg-surface-raised px-3 text-ink"
      />
      @if (linkForm.password().touched() && linkForm.password().errors().length) {
        <p class="text-sm text-rate-again" role="alert">{{ linkForm.password().errors().at(0)?.message }}</p>
      }
    </div>
    @if (errorMessage(); as message) {
      <p class="text-sm text-rate-again" role="alert" aria-live="assertive">{{ message }}</p>
    }
    <button
      type="submit"
      [disabled]="submitting()"
      class="h-[var(--control-height)] w-full rounded-md bg-amber text-on-amber disabled:opacity-55"
    >
      Vincular conta
    </button>
  </form>
</main>
