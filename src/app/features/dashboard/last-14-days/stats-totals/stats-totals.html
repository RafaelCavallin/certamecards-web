<dl class="grid grid-cols-3 gap-4 text-sm">
  <div>
    <dt class="text-ink-muted">Revisões</dt>
    <dd class="font-sans text-lg font-semibold text-ink">{{ label() }}</dd>
  </div>
  <div>
    <dt class="text-ink-muted">Acerto</dt>
    <dd class="font-sans text-lg font-semibold text-ink">{{ accuracyPercent() }}%</dd>
  </div>
  <div>
    <dt class="text-ink-muted">Minutos de foco</dt>
    <dd class="font-sans text-lg font-semibold text-ink">{{ focusMinutes() }}</dd>
  </div>
</dl>
