<main class="mx-auto flex max-w-[720px] flex-col gap-6 px-6 py-12">
  <header class="space-y-2">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <h1 class="font-serif text-4xl text-ink">{{ greeting() }}{{ firstName() ? ', ' + firstName() : '' }}</h1>
      <div class="flex flex-wrap items-center gap-3">
        <app-sync-indicator [status]="syncService.status()" [pendingCount]="syncService.pendingCount()" />
        <app-library-button label="Biblioteca" />
        <button appButton variant="ghost" size="sm" type="button" (click)="settingsOpen.set(true)">Ajustes</button>
        <app-sign-out-button />
      </div>
    </div>
    <p class="text-ink-muted">{{ contextLine() }}</p>
  </header>
  <button appButton variant="primary" type="button" [disabled]="!canStartSession()" (click)="onStartSession()">
    {{ canStartSession() ? 'Começar sessão' : 'Tudo em dia' }}
  </button>
  <app-last-14-days />
  @if (!hasDecks()) {
    <app-dashboard-empty />
  } @else {
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-sans text-lg font-semibold text-ink">Decks</h2>
        <button appButton size="sm" type="button" (click)="onNewDeck()">Novo deck</button>
      </div>
      @if (subjectFilters().length > 1) {
        <div class="flex flex-wrap gap-2">
          <button type="button" (click)="selectedSubjectId.set('all')">
            <app-tag [tone]="selectedSubjectId() === 'all' ? 'accent' : 'neutral'">Todas</app-tag>
          </button>
          @for (subject of subjectFilters(); track subject.id) {
            <button type="button" (click)="selectedSubjectId.set(subject.id)">
              <app-tag [tone]="selectedSubjectId() === subject.id ? 'accent' : 'neutral'">{{ subject.name }}</app-tag>
            </button>
          }
        </div>
      }
      <div>
        @for (entry of visibleDeckCounts(); track entry.deck.id) {
          <app-deck-row
            [title]="entry.deck.name"
            [subject]="subjectName(entry.deck.subjectId)"
            [badges]="badgesOf(entry.deck)"
            [due]="entry.due"
            [fresh]="entry.fresh"
            (open)="onOpenDeck(entry.deck.id)"
            (study)="onStudyDeck(entry.deck.id)"
          />
        }
      </div>
    </section>
  }
</main>
<app-settings-sheet [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
