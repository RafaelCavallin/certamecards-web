<main class="mx-auto max-w-[520px] space-y-6 px-6 py-12">
  <h1 class="font-serif text-2xl text-ink">Novo deck</h1>
  @if (errorMessage(); as message) {
    <p class="text-sm text-rate-again" role="alert" aria-live="assertive">{{ message }}</p>
  }
  <app-deck-form [subjects]="subjectsData.active()" (saved)="onSaved($event)" />
</main>
