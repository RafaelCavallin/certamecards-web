<app-sheet [open]="open()" [title]="cardId() === null ? 'Novo cartão' : 'Editar cartão'" (closed)="onClose()">
  @if (errorMessage(); as message) {
    <p class="mb-4 text-sm text-rate-again" role="alert" aria-live="assertive">{{ message }}</p>
  }
  @if (open()) {
    <app-card-form [initial]="initialModel()" [keepOnSave]="true" [saving]="saving()" (saved)="onSave($event)" />
  }
  @if (cardId() !== null) {
    <div class="mt-6 space-y-3 border-t border-line pt-4">
      @if (history(); as summary) {
        <p class="text-sm text-ink-muted">
          {{ summary.reviews }} revisões · {{ summary.again }} de novo
          @if (summary.lastReviewedAt) {
            · última em {{ summary.lastReviewedAt | slice: 0 : 10 }}
          }
        </p>
      }
      <div class="flex gap-2">
        <button appButton size="sm" type="button" (click)="onToggleSuspend()">
          {{ isSuspended() ? 'Reativar' : 'Suspender' }}
        </button>
        <button appButton variant="ghost" size="sm" type="button" (click)="onDelete()">
          Excluir
        </button>
      </div>
    </div>
  }
</app-sheet>
<app-confirm-dialog
  [open]="deleteConfirmOpen()"
  title="Excluir cartão"
  message="Esse cartão e o progresso dele serão apagados. Essa ação não pode ser desfeita."
  confirmLabel="Excluir"
  (confirmed)="onConfirmDelete()"
  (canceled)="deleteConfirmOpen.set(false)"
/>
